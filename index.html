<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History Quiz Website</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ece9e6, #ffffff);
      margin: 0;
      padding: 0;
      text-align: center;
      color: #333;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 2rem 1rem;
      border-bottom-left-radius: 2rem;
      border-bottom-right-radius: 2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    main {
      padding: 2rem;
    }
    a.button {
      display: inline-block;
      background: #4CAF50;
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }
    a.button:hover {
      background: #45a049;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to the History Quiz</h1>
    <p>Test your knowledge in a fun and simple way!</p>
  </header>
  <main>
    <p>This site is a demo hosted on GitHub Pages. Click below to try the quiz:</p>
    <a class="button" href="quiz.html">Start Quiz</a>
  </main>
</body>
</html>
