<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Anh hùng Phan Đình Giót</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Background blur */
    .background-blur {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('../images/background.jpg') no-repeat center center fixed;
      background-size: cover;
      filter: blur(8px);
      opacity: 0.5;
      z-index: -1;
    }

    .quiz-box {
      background: rgba(255, 255, 255, 0.9);
      padding: 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 450px;
      width: 90%;
      z-index: 1;
      position: relative;
    }

    h1 {
      margin-bottom: 1rem;
      color: #333;
    }
    p.question {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    button {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.8rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #45a049;
      transform: scale(1.02);
    }
    #result {
      margin-top: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .home-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 2;
    }
    .home-button img {
      width: 70px;
      height: auto;
      transition: 0.3s;
    }
    .home-button img:hover {
      transform: scale(1.1);
    }

    .info-button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.8rem 1.5rem;
      background: #1976d2;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background 0.3s, transform 0.3s;
    }
    .info-button:hover {
      background-color: #1565c0;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="background-blur"></div>

  <a href="../home-page/index.html" class="home-button">
    <img src="../images/logo-preview.png" alt="Trang chủ">
  </a>

  <div class="quiz-box">
    <h1>Anh hùng Phan Đình Giót</h1>
    <p id="question" class="question"></p>
    <div id="answers"></div>
    <p id="result"></p>

    <a href="info.html" class="info-button">Tìm hiểu thêm</a>
  </div>

  <script>
    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    const questions = [
      {
        q: "Anh hùng Phan Đình Giót quê ở đâu?",
        options: shuffle(["Hà Tĩnh", "Nghệ An", "Thanh Hóa", "Quảng Bình"]),
        answer: "Hà Tĩnh"
      },
      {
        q: "Phan Đình Giót hy sinh trong trận đánh cứ điểm nào?",
        options: shuffle(["Him Lam", "Độc Lập", "A1", "Hồng Cúm"]),
        answer: "Him Lam"
      },
      {
        q: "Hành động anh hùng gắn liền với tên tuổi Phan Đình Giót là gì?",
        options: shuffle([
          "Lấy thân mình chèn pháo",
          "Lấy thân mình lấp lỗ châu mai",
          "Dùng thân làm giá súng",
          "Cầm cờ xung phong"
        ]),
        answer: "Lấy thân mình lấp lỗ châu mai"
      },
      {
        q: "Năm hy sinh của anh hùng Phan Đình Giót là?",
        options: shuffle(["1953", "1954", "1952", "1955"]),
        answer: "1954"
      }
    ];

    const randomQuestion = questions[Math.floor(Math.random() * questions.length)];
    document.getElementById("question").innerText = randomQuestion.q;

    const answersDiv = document.getElementById("answers");
    randomQuestion.options.forEach(option => {
      const btn = document.createElement("button");
      btn.innerText = option;
      btn.addEventListener('click', () => checkAnswer(btn, option), { once: true });
      answersDiv.appendChild(btn);
    });

    function checkAnswer(btn, selected) {
      const result = document.getElementById("result");
      const buttons = answersDiv.querySelectorAll('button');
      buttons.forEach(b => {
        b.disabled = true;
        b.style.opacity = '0.6';
        b.style.pointerEvents = 'none';
      });

      if (selected === randomQuestion.answer) {
        result.innerText = "✅ Chính xác!";
        result.style.color = "green";
        btn.style.background = "#2e7d32";
        btn.style.color = "white";
      } else {
        result.innerText = "❌ Sai rồi!";
        result.style.color = "red";
        btn.style.background = "#c62828";
        btn.style.color = "white";
        buttons.forEach(b => {
          if (b.innerText === randomQuestion.answer) {
            b.style.background = "#2e7d32";
            b.style.color = "white";
            b.style.opacity = "1";
          }
        });
      }
    }
  </script>
</body>
</html>
