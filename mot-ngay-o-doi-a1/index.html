<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Một ngày ở đồi A1</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
    }

    /* Background blur */
    .background-blur {
      position: fixed;
      inset: 0;
      background: url('../images/background.jpg') no-repeat center center / cover;
      filter: blur(8px);
      opacity: 0.5;
      z-index: -1;
    }

    header {
      background: #4CAF50;
      color: white;
      padding: 2rem 1rem;
      border-bottom-left-radius: 2rem;
      border-bottom-right-radius: 2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      box-sizing: border-box;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    main {
      padding: 2rem 1rem 3rem;
      width: 100%;
      max-width: 900px;
    }

    a.button {
      display: inline-block;
      background: #4CAF50;
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
      margin-bottom: 1rem;
    }
    a.button:hover {
      background: #45a049;
      transform: scale(1.05);
    }

    .home-button {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .home-button img {
      width: 70px;
      height: auto;
      transition: transform .25s;
    }
    .home-button img:hover { transform: scale(1.1); }

    .info-button {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      background: #1976d2;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background 0.3s, transform 0.3s;
    }
    .info-button:hover {
      background-color: #1565c0;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="background-blur"></div>

  <a class="home-button" href="../home-page/index.html">
    <img src="../images/logo-preview.png" alt="Trang chủ">
  </a>

  <header>
    <h1>Một ngày ở đồi A1</h1>
  </header>

  <main>
    <a class="button" href="quiz.html">Bắt đầu Quiz</a>

    <br>
    <a class="info-button" href="info.html" title="Tìm hiểu về Một ngày ở đồi A1">Tìm hiểu thêm</a>
  </main>

</body>
</html>
