<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Anh hùng Phan Đình Giót</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .quiz-box {
      background: white;
      padding: 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 450px;
      width: 90%;
    }
    h1 {
      margin-bottom: 1rem;
      color: #333;
    }
    p.question {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    button {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.8rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #45a049;
      transform: scale(1.02);
    }
    #result {
      margin-top: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="quiz-box">
    <h1>Anh hùng Phan Đình Giót</h1>
    <p id="question" class="question"></p>
    <div id="answers"></div>
    <p id="result"></p>
  </div>

  <script>
    const questions = [
      {
        q: "Anh hùng Phan Đình Giót quê ở đâu?",
        options: ["Hà Tĩnh", "Nghệ An", "Thanh Hóa", "Quảng Bình"],
        answer: "Hà Tĩnh"
      },
      {
        q: "Phan Đình Giót hy sinh trong trận đánh cứ điểm nào?",
        options: ["Him Lam", "Độc Lập", "A1", "Hồng Cúm"],
        answer: "Him Lam"
      },
      {
        q: "Hành động anh hùng gắn liền với tên tuổi Phan Đình Giót là gì?",
        options: ["Lấy thân mình chèn pháo", "Lấy thân mình lấp lỗ châu mai", "Dùng thân làm giá súng", "Cầm cờ xung phong"],
        answer: "Lấy thân mình lấp lỗ châu mai"
      },
      {
        q: "Năm hy sinh của anh hùng Phan Đình Giót là?",
        options: ["1953", "1954", "1952", "1955"],
        answer: "1954"
      }
    ];

    // chọn ngẫu nhiên 1 câu hỏi
    const randomQuestion = questions[Math.floor(Math.random() * questions.length)];

    // hiển thị câu hỏi
    document.getElementById("question").innerText = randomQuestion.q;

    const answersDiv = document.getElementById("answers");
    randomQuestion.options.forEach(option => {
      const btn = document.createElement("button");
      btn.innerText = option;
      btn.onclick = () => checkAnswer(option);
      answersDiv.appendChild(btn);
    });

    function checkAnswer(selected) {
      const result = document.getElementById("result");
      if (selected === randomQuestion.answer) {
        result.innerText = "✅ Chính xác!";
        result.style.color = "green";
      } else {
        result.innerText = "❌ Sai rồi, thử lại!";
        result.style.color = "red";
      }
    }
  </script>
</body>
</html>
