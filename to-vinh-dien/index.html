<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Anh hùng Phan Đình Giót</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ece9e6, #ffffff);
      margin: 0;
      padding: 0;
      text-align: center;
      color: #333;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 2rem 1rem;
      border-bottom-left-radius: 2rem;
      border-bottom-right-radius: 2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    main {
      padding: 2rem;
    }
    a.button {
      display: inline-block;
      background: #4CAF50;
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }
    a.button:hover {
      background: #45a049;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <header>
    <h1>Anh hùng Tô Vĩnh Diện</h1>
    <p>Trang web giới thiệu và kiểm tra kiến thức</p>
  </header>
  <main>
    <p>Nhấn nút bên dưới để bắt đầu trả lời câu hỏi:</p>
    <a class="button" href="quiz.html">Bắt đầu Quiz</a>
  </main>
</body>
</html>
